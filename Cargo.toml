[package]
name = "chain-trade-mcp"
version = "0.1.0"
edition = "2021"

[lib]
name = "chain_trade_mcp"
path = "src/lib.rs"

[[bin]]
name = "chain-trade-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
alloy = { version = "0.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dotenv = "0.15"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"
url = "2.5"
hex = "0.4"
lettre = "0.11"
moka = { version = "0.12", features = ["future"] }

[dev-dependencies]
serial_test = "3.0"
